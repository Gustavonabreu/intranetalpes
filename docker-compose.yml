services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: alpes_backend_dev
    ports:
      - "3000:3000"  # exponha a porta do seu Node aqui
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      # Adicione aqui o IP/host da sua rede se precisar acessar de outra máquina na LAN
      - CORS_ORIGINS=http://localhost:5173
    networks:
      - alpes-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: alpes_frontend_dev
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      # Aponta para o backend exposto no host; troque para o IP/host da sua LAN se for acessar de outra máquina
      - VITE_API_URL=http://localhost:3000
      - VITE_LEGACY_API_URL=http://localhost:3000
    networks:
      - alpes-network
    depends_on:
      - server

networks:
  alpes-network:
    driver: bridge
